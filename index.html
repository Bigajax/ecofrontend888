    <!-- Helpers: --vh para 100vh e feature flag de backdrop-filter -->
    <script>
      (function () {
        function setVh() {
          var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
          document.documentElement.style.setProperty('--vh', vh + 'px');
        }
        setVh();
        window.addEventListener('resize', setVh, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setVh, { passive: true });
        }
        var supportsBackdrop =
          (window.CSS && CSS.supports && CSS.supports('backdrop-filter', 'blur(1px)')) ||
          (window.CSS && CSS.supports && CSS.supports('-webkit-backdrop-filter', 'blur(1px)'));
        if (supportsBackdrop) document.documentElement.classList.add('supports-backdrop');
      })();
    </script>

    <!-- Pequeno reset para cores de fundo e altura mínima -->

      html, body, #root { height: 100%; }

        margin: 0;
        background-color: var(--bg-primary, #FFFFFF);
        color: var(--text-primary, #0D1B2A);

  <body class="min-h-viewport">
    <!-- Facebook Pixel noscript (deve ficar no body) -->
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1452404496069451&ev=PageView&noscript=1"
    /></noscript>
    <div id="root">
      <!-- 🛡️ FALLBACK DE SEGURANÇA: Mostrado se React não montar em 10s -->
      <!-- Crítico para Safari Mobile que pode falhar ao carregar após inatividade -->
      <div id="loading-fallback" style="
        display: flex;
        min-height: 100vh;
        width: 100%;
        align-items: center;
        justify-content: center;
        background: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        padding: 20px;
        box-sizing: border-box;
      ">
        <div style="text-align: center; max-width: 400px;">
          <!-- Conceito ECO: ondas que partem do símbolo, no ritmo de uma respiração -->
          <div style="
            position: relative;
            margin: 0 auto 36px;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
          ">
            <!-- Aura -->
            <span style="
              position: absolute;
              width: 260px;
              height: 260px;
              border-radius: 50%;
              background: radial-gradient(circle, rgba(110,200,255,0.18) 0%, rgba(110,200,255,0) 68%);
              animation: ecoAura 5.6s ease-in-out infinite;
            "></span>
            <!-- Ondas-eco escalonadas -->
            <span style="
              position: absolute; width: 118px; height: 118px; border-radius: 50%;
              border: 1px solid rgba(110,200,255,0.45);
              animation: ecoEcho 4.8s cubic-bezier(0.22,0.61,0.36,1) infinite;
            "></span>
            <span style="
              position: absolute; width: 118px; height: 118px; border-radius: 50%;
              border: 1px solid rgba(110,200,255,0.45);
              animation: ecoEcho 4.8s cubic-bezier(0.22,0.61,0.36,1) infinite;
              animation-delay: 1.6s;
            "></span>
            <span style="
              position: absolute; width: 118px; height: 118px; border-radius: 50%;
              border: 1px solid rgba(110,200,255,0.45);
              animation: ecoEcho 4.8s cubic-bezier(0.22,0.61,0.36,1) infinite;
              animation-delay: 3.2s;
            "></span>
            <!-- Símbolo respirando -->
            <img
              src="/images/ecotopia-logo-mark.webp"
              alt="Ecotopia"
              width="74"
              height="74"
              style="
                position: relative;
                width: 74px;
                height: 74px;
                object-fit: contain;
                animation: ecoBreathe 5.6s ease-in-out infinite;
              "
            />
          </div>

          <!-- Legenda em Lora itálico (serif de display da marca) -->
          <p style="
            font-family: 'Lora', Georgia, serif;
            font-style: italic;
            font-size: 15px;
            letter-spacing: 0.01em;
            color: #6B8099;
            margin: 0;
            animation: ecoCaption 4.4s ease-in-out infinite;
          ">carregando…</p>
        </div>
      </div>
    </div>

    <!-- No app logado (/app), a primeira tela já é o reino se desenhando, na cor da hora de Brasília.
         Landing e funil seguem com a tela acima. -->
    <script>
      (function () {
        // Quem está logado (sessão salva do Supabase) vê o reino em qualquer rota;
        // só o visitante das landings e do funil fica com a tela original.
        var logado = false;
        try { logado = !!localStorage.getItem('eco-auth-token'); } catch (e) {}
        if (location.pathname.indexOf('/app') !== 0 && !logado) return;
        var el = document.getElementById('loading-fallback');
        if (!el) return;
        var h = 20;
        try {
          h = Number(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Sao_Paulo', hour: 'numeric', hourCycle: 'h23' }).format(new Date()));
        } catch (e) {}
        var c = h >= 5 && h < 12
          ? { bg: '#F1E8D6', fg: '#2A2238', linha: '#C98E86' }
          : h >= 12 && h < 20
          ? { bg: '#4A1F2E', fg: '#F4E7DE', linha: '#EDB85A' }
          : { bg: '#10153A', fg: '#F4F1E8', linha: '#EDB85A' };
        // o astro da hora (mesmos traços de src/components/reino/astroFormas.ts)
        var a = h >= 5 && h < 12
          ? { raios: 'M60 14v14M60 92v14M14 60h14M92 60h14M27.5 27.5l10 10M82.5 82.5l10 10M92.5 27.5l-10 10M37.5 82.5l-10 10',
              corpo: 'M61.6 33.8c14.6.8 26 12.6 25 28-1 15.2-13.6 25.6-28 24.6-13.9-1-24.7-13.1-23.6-27.3 1-14.4 12.2-26 26.6-25.3Z',
              brilho: 'M47.5 52c6.4-7.4 17.4-8.2 23.6.6' }
          : h >= 12 && h < 20
          ? { raios: 'M60.4 26v13M29.6 39.8l8.6 8.4M91.2 39.4l-8.8 8.6M14.6 66.4l12.2 2.6M105.6 66l-12.2 2.8',
              corpo: 'M33.4 80c.2-16.2 12.4-28.4 27.4-28 14.6.4 25.6 12.4 25.8 28Z',
              brilho: 'M46 70.4c4.2-7 13.4-9.2 20.4-4' }
          : { raios: 'M88.6 30.4v.2M99.4 50.2v.2',
              corpo: 'M68.4 28.6C50 28.8 35.2 43.2 35.6 61.4c.4 18 15.8 31.6 33.6 30.4 8.8-.6 16.4-4.4 21.4-10.6-5.4 1.8-11.4 2-17.2.2-12.8-4.2-20.8-16.6-18.8-29.6 1.4-9.8 6.6-17.6 13.8-23.2Z',
              brilho: '' };
        el.style.background = c.bg;
        el.style.flexDirection = 'column';
        el.innerHTML =
          '<style>@keyframes rR{0%{stroke-dashoffset:16;opacity:.2}45%,80%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}' +
          '@keyframes rH{0%{stroke-dashoffset:240}60%,85%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}' +
          '@media (prefers-reduced-motion:reduce){#loading-fallback path{animation:none!important;stroke-dashoffset:0!important}}</style>' +
          '<svg viewBox="0 0 120 120" width="96" height="96" aria-hidden="true" style="overflow:visible">' +
          '<g fill="none" stroke="#EDB85A" stroke-width="5" stroke-linecap="round" style="stroke-dasharray:16;stroke-dashoffset:16;animation:rR 2.6s ease-in-out infinite">' +
          '<path d="' + a.raios + '"/></g>' +
          '<path fill="#EDB85A" d="' + a.corpo + '"/>' +
          (a.brilho ? '<path fill="none" stroke="#F6D48C" stroke-width="4" stroke-linecap="round" d="' + a.brilho + '"/>' : '') +
          '</svg>' +
          '<svg viewBox="0 0 240 12" width="180" height="12" preserveAspectRatio="none" aria-hidden="true" style="margin-top:10px">' +
          '<path fill="none" stroke="' + c.linha + '" stroke-width="2.2" stroke-linecap="round" style="stroke-dasharray:240;stroke-dashoffset:240;animation:rH 2.6s ease-in-out infinite" d="M4 7.2C40 3.6 82 9.4 122 6.2s78-4.2 114 1.4"/></svg>' +
          '<p style="margin:20px 0 0;font:400 22px/1.25 \'Young Serif\',Georgia,serif;color:' + c.fg + '">Abrindo o reino</p>';
      })();
    </script>

    <!-- Animação do spinner -->
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes ecoBreathe {
        0%, 100% { transform: scale(1);    filter: drop-shadow(0 8px 18px rgba(54,168,232,0.20)); }
        50%      { transform: scale(1.05); filter: drop-shadow(0 12px 30px rgba(54,168,232,0.34)); }
      }
      @keyframes ecoEcho {
        0%   { transform: scale(0.55); opacity: 0; }
        14%  { opacity: 0.5; }
        100% { transform: scale(2.15); opacity: 0; }
      }
      @keyframes ecoAura {
        0%, 100% { transform: scale(1);    opacity: 0.55; }
        50%      { transform: scale(1.12); opacity: 0.9; }
      }
      @keyframes ecoCaption {
        0%, 100% { opacity: 0.45; }
        50%      { opacity: 0.95; }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading-fallback img,
        #loading-fallback span,
        #loading-fallback p { animation: none !important; }
      }

      /* 🛡️ Ocultar fallback quando React montar */
      #loading-fallback {
        pointer-events: none; /* CRÍTICO: Nunca bloquear cliques */
      }

      /* Ocultar fallback quando app montar (flag setada pelo React) */
      body.app-mounted #loading-fallback {
        display: none !important;
      }
    </style>

    <!-- Script de timeout de segurança -->
    <script>
      (function() {
        // 🛡️ PROTEÇÃO: Se após 10s React não montou, mostrar erro amigável
        var startTime = Date.now();
        var fallbackShown = false;

        // 🛡️ Observador para detectar quando React monta
        var observer = new MutationObserver(function() {
          // Verificar se React montou (flag global ou conteúdo no root)
          if (window.__APP_MOUNTED__ || document.getElementById('root')?.children.length > 1) {
            // React montou! Remover fallback e parar observação
            var fallback = document.getElementById('loading-fallback');
            if (fallback) {
              fallback.style.display = 'none';
            }
            document.body.classList.add('app-mounted');
            observer.disconnect();

            console.info('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.info('[index.html] ✅ React montou com sucesso!');
            console.info('[index.html] Fallback removido');
            console.info('[index.html] Tempo de carregamento:', Math.round((Date.now() - startTime) / 1000) + 's');
            console.info('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
          }
        });

        // Observar mudanças no root
        var root = document.getElementById('root');
        if (root) {
          observer.observe(root, { childList: true, subtree: true });
        }

        setTimeout(function() {
          // 🛡️ Se React já montou, não fazer nada
          if (window.__APP_MOUNTED__ || document.body.classList.contains('app-mounted')) {
            console.info('[index.html] ✅ Timeout de 10s alcançado mas React já montou - tudo OK!');
            return;
          }

          var root = document.getElementById('root');
          var fallback = document.getElementById('loading-fallback');

          // Se root ainda vazio ou só com fallback, significa que React não montou
          if (root && (root.children.length <= 1 || !root.textContent.trim().replace(/\s+/g, ''))) {
            fallbackShown = true;

            console.error('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.error('[index.html] ⚠️ FALLBACK DE SEGURANÇA ATIVADO');
            console.error('[index.html] React não montou após 10s');
            console.error('[index.html] Mostrando tela de erro amigável');
            console.error('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');

            if (fallback) {
              // Habilitar pointer-events APENAS para fallback de erro (com botões)
              fallback.style.pointerEvents = 'auto';
              fallback.innerHTML = `
                <div style="text-align: center; max-width: 420px; padding: 32px; background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
                  <!-- Ícone de Erro -->
                  <div style="
                    width: 64px;
                    height: 64px;
                    margin: 0 auto 20px;
                    background: #FEE2E2;
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 32px;
                  ">⚠️</div>

                  <h1 style="
                    font-size: 20px;
                    font-weight: 600;
                    color: #1E293B;
                    margin: 0 0 12px;
                  ">Ops! Algo deu errado</h1>

                  <p style="
                    font-size: 14px;
                    color: #64748B;
                    line-height: 1.6;
                    margin: 0 0 24px;
                  ">
                    O aplicativo não conseguiu carregar corretamente.
                    ${/safari/i.test(navigator.userAgent) && !/chrome/i.test(navigator.userAgent)
                      ? 'Isso pode acontecer no Safari após inatividade.'
                      : 'Tente recarregar a página.'
                    }
                  </p>

                  <!-- Botões -->
                  <div style="display: flex; flex-direction: column; gap: 12px;">
                    <button onclick="window.location.reload()" style="
                      width: 100%;
                      padding: 14px 24px;
                      background: #3B82F6;
                      color: white;
                      border: none;
                      border-radius: 12px;
                      font-size: 15px;
                      font-weight: 600;
                      cursor: pointer;
                      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
                    ">🔄 Recarregar Página</button>

                    <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.href = '/login';" style="
                      width: 100%;
                      padding: 14px 24px;
                      background: white;
                      color: #64748B;
                      border: 2px solid #E2E8F0;
                      border-radius: 12px;
                      font-size: 15px;
                      font-weight: 600;
                      cursor: pointer;
                    ">🏠 Limpar e Ir para Login</button>
                  </div>

                  <p style="
                    font-size: 12px;
                    color: #94A3B8;
                    margin: 16px 0 0;
                  ">Tempo de espera: ${Math.round((Date.now() - startTime) / 1000)}s</p>
                </div>
              `;
            }
          }
        }, 10000); // 10 segundos

        // Listener de erros globais
        window.addEventListener('error', function(e) {
          console.error('[index.html] 🚨 Erro global capturado:', e.message, e.filename, e.lineno, e.colno);
        });

        window.addEventListener('unhandledrejection', function(e) {
          console.error('[index.html] 🚨 Promise rejection não tratada:', e.reason);
        });
      })();
    </script>

    <script type="module" src="./src/main.tsx"></script>
  </body>
