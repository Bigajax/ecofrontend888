    <!-- Helpers: --vh para 100vh e feature flag de backdrop-filter -->
    <script>
      (function () {
        function setVh() {
          var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
          document.documentElement.style.setProperty('--vh', vh + 'px');
        }
        setVh();
        window.addEventListener('resize', setVh, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setVh, { passive: true });
        }
        var supportsBackdrop =
          (window.CSS && CSS.supports && CSS.supports('backdrop-filter', 'blur(1px)')) ||
          (window.CSS && CSS.supports && CSS.supports('-webkit-backdrop-filter', 'blur(1px)'));
        if (supportsBackdrop) document.documentElement.classList.add('supports-backdrop');
      })();
    </script>

    <!-- Pequeno reset para cores de fundo e altura mínima -->
    <style>
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        background-color: var(--bg-primary, #FFFFFF);
        color: var(--text-primary, #0D1B2A);
      }
      /* fallback p/ browsers sem svh: 100*var(--vh) */
      .min-h-viewport {
        min-height: calc(var(--vh, 1vh) * 100);
      }
    </style>

  <body class="min-h-viewport">
    <!-- Facebook Pixel noscript (deve ficar no body) -->
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1452404496069451&ev=PageView&noscript=1"
    /></noscript>
    <div id="root">
      <!-- Carregamento do reino: o script abaixo pinta o astro e o céu da hora. -->
      <div id="loading-fallback" style="
        display: flex;
        min-height: 100vh;
        width: 100%;
        align-items: center;
        justify-content: center;
        background: #10153A;
        box-sizing: border-box;
      "></div>
    </div>

    <!-- A primeira tela é o reino se desenhando, na cor da hora de Brasília, em qualquer rota. -->
    <script>
      (function () {
        var el = document.getElementById('loading-fallback');
        if (!el) return;
        var h = 20;
        try {
          h = Number(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Sao_Paulo', hour: 'numeric', hourCycle: 'h23' }).format(new Date()));
        } catch (e) {}
        var c = h >= 5 && h < 12
          ? { bg: '#F1E8D6', fg: '#2A2238', linha: '#C98E86' }
          : h >= 12 && h < 20
          ? { bg: '#4A1F2E', fg: '#F4E7DE', linha: '#EDB85A' }
          : { bg: '#10153A', fg: '#F4F1E8', linha: '#EDB85A' };
        // o astro da hora (mesmos traços de src/components/reino/astroFormas.ts)
        var a = h >= 5 && h < 12
          ? { raios: 'M60 14v14M60 92v14M14 60h14M92 60h14M27.5 27.5l10 10M82.5 82.5l10 10M92.5 27.5l-10 10M37.5 82.5l-10 10',
              corpo: 'M61.6 33.8c14.6.8 26 12.6 25 28-1 15.2-13.6 25.6-28 24.6-13.9-1-24.7-13.1-23.6-27.3 1-14.4 12.2-26 26.6-25.3Z',
              brilho: 'M47.5 52c6.4-7.4 17.4-8.2 23.6.6' }
          : h >= 12 && h < 20
          ? { raios: 'M60.4 26v13M29.6 39.8l8.6 8.4M91.2 39.4l-8.8 8.6M14.6 66.4l12.2 2.6M105.6 66l-12.2 2.8',
              corpo: 'M33.4 80c.2-16.2 12.4-28.4 27.4-28 14.6.4 25.6 12.4 25.8 28Z',
              brilho: 'M46 70.4c4.2-7 13.4-9.2 20.4-4' }
          : { raios: 'M88.6 30.4v.2M99.4 50.2v.2',
              corpo: 'M68.4 28.6C50 28.8 35.2 43.2 35.6 61.4c.4 18 15.8 31.6 33.6 30.4 8.8-.6 16.4-4.4 21.4-10.6-5.4 1.8-11.4 2-17.2.2-12.8-4.2-20.8-16.6-18.8-29.6 1.4-9.8 6.6-17.6 13.8-23.2Z',
              brilho: '' };
        el.style.background = c.bg;
        el.style.flexDirection = 'column';
        el.innerHTML =
          '<style>@keyframes rR{0%{stroke-dashoffset:16;opacity:.2}45%,80%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}' +
          '@keyframes rH{0%{stroke-dashoffset:240}60%,85%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}' +
          '@media (prefers-reduced-motion:reduce){#loading-fallback path{animation:none!important;stroke-dashoffset:0!important}}</style>' +
          '<svg viewBox="0 0 120 120" width="96" height="96" aria-hidden="true" style="overflow:visible">' +
          '<g fill="none" stroke="#EDB85A" stroke-width="5" stroke-linecap="round" style="stroke-dasharray:16;stroke-dashoffset:16;animation:rR 2.6s ease-in-out infinite">' +
          '<path d="' + a.raios + '"/></g>' +
          '<path fill="#EDB85A" d="' + a.corpo + '"/>' +
          (a.brilho ? '<path fill="none" stroke="#F6D48C" stroke-width="4" stroke-linecap="round" d="' + a.brilho + '"/>' : '') +
          '</svg>' +
          '<svg viewBox="0 0 240 12" width="180" height="12" preserveAspectRatio="none" aria-hidden="true" style="margin-top:' + (h >= 12 && h < 20 ? '-38px' : '10px') + '">' +
          '<path fill="none" stroke="' + c.linha + '" stroke-width="2.2" stroke-linecap="round" style="stroke-dasharray:240;stroke-dashoffset:240;animation:rH 2.6s ease-in-out infinite" d="M4 7.2C40 3.6 82 9.4 122 6.2s78-4.2 114 1.4"/></svg>' +
          '<p style="margin:20px 0 0;font:400 22px/1.25 \'Young Serif\',Georgia,serif;color:' + c.fg + '">Abrindo o reino</p>';
      })();
    </script>

    <!-- Animação do spinner -->
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* 🛡️ Ocultar fallback quando React montar */
      #loading-fallback {
        pointer-events: none; /* CRÍTICO: Nunca bloquear cliques */
      }

      /* Ocultar fallback quando app montar (flag setada pelo React) */
      body.app-mounted #loading-fallback {
        display: none !important;
      }
    </style>

    <!-- Script de timeout de segurança -->
    <script>
      (function() {
        // 🛡️ PROTEÇÃO: Se após 10s React não montou, mostrar erro amigável
        var startTime = Date.now();
        var fallbackShown = false;

        // 🛡️ Observador para detectar quando React monta
        var observer = new MutationObserver(function() {
          // Verificar se React montou (flag global ou conteúdo no root)
          if (window.__APP_MOUNTED__ || document.getElementById('root')?.children.length > 1) {
            // React montou! Remover fallback e parar observação
            var fallback = document.getElementById('loading-fallback');
            if (fallback) {
              fallback.style.display = 'none';
            }
            document.body.classList.add('app-mounted');
            observer.disconnect();

            console.info('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.info('[index.html] ✅ React montou com sucesso!');
            console.info('[index.html] Fallback removido');
            console.info('[index.html] Tempo de carregamento:', Math.round((Date.now() - startTime) / 1000) + 's');
            console.info('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
          }
        });

        // Observar mudanças no root
        var root = document.getElementById('root');
        if (root) {
          observer.observe(root, { childList: true, subtree: true });
        }

        setTimeout(function() {
          // 🛡️ Se React já montou, não fazer nada
          if (window.__APP_MOUNTED__ || document.body.classList.contains('app-mounted')) {
            console.info('[index.html] ✅ Timeout de 10s alcançado mas React já montou - tudo OK!');
            return;
          }

          var root = document.getElementById('root');
          var fallback = document.getElementById('loading-fallback');

          // Se root ainda vazio ou só com fallback, significa que React não montou
          if (root && (root.children.length <= 1 || !root.textContent.trim().replace(/\s+/g, ''))) {
            fallbackShown = true;

            console.error('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.error('[index.html] ⚠️ FALLBACK DE SEGURANÇA ATIVADO');
            console.error('[index.html] React não montou após 10s');
            console.error('[index.html] Mostrando tela de erro amigável');
            console.error('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');

            if (fallback) {
              // Habilitar pointer-events APENAS para fallback de erro (com botões)
              fallback.style.pointerEvents = 'auto'; fallback.style.background = '#10153A';
              fallback.innerHTML = `
                <div style="text-align: left; max-width: 360px; padding: 0 20px; color: #F4F1E8; font-family: Figtree, system-ui, sans-serif;">
                  <h1 style="margin: 0 0 10px; font: 400 30px/1.1 'Young Serif', Georgia, serif;">O caminho não abriu.</h1>
                  <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: rgba(244,241,232,0.72);">
                    O app não terminou de carregar.
                    ${/safari/i.test(navigator.userAgent) && !/chrome/i.test(navigator.userAgent)
                      ? 'No Safari isso acontece depois de um tempo parado.'
                      : 'Recarregar costuma resolver.'
                    }
                  </p>
                  <button onclick="window.location.reload()" style="
                    display: block; min-height: 46px; padding: 12px 22px; border: 0; border-radius: 3px 8px 4px 9px;
                    background: #EDB85A; color: #1C2350; font: 600 13px Figtree, system-ui, sans-serif;
                    letter-spacing: 0.07em; text-transform: uppercase; cursor: pointer;
                  ">Recarregar</button>
                  <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.href = '/login';" style="
                    margin-top: 14px; padding: 0; border: 0; background: none; color: #F4F1E8;
                    font: 500 13px Figtree, system-ui, sans-serif; text-decoration: underline;
                    text-decoration-color: #EDB85A; text-underline-offset: 4px; cursor: pointer;
                  ">Limpar e voltar para a entrada</button>
                </div>
              `;
            }
          }
        }, 10000); // 10 segundos

        // Listener de erros globais
        window.addEventListener('error', function(e) {
          console.error('[index.html] 🚨 Erro global capturado:', e.message, e.filename, e.lineno, e.colno);
        });

        window.addEventListener('unhandledrejection', function(e) {
          console.error('[index.html] 🚨 Promise rejection não tratada:', e.reason);
        });
      })();
    </script>

    <script type="module" src="./src/main.tsx"></script>
  </body>
